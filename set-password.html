<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <title>Activation du compte | AIESEC Gala 2027</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/set-password.js" defer></script>
</head>

<body class="auth-page">

    <main class="auth-container">
        <div class="auth-card">

            <h1>Activer mon compte</h1>

            <p>
                Bienvenue dans l'espace organisateurs du
                Dîner de Gala AIESEC 2027.
            </p>

            <p>Veuillez définir votre mot de passe personnel.</p>

            <form id="password-form">

                <div class="form-group">
                    <label for="password">Nouveau mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        minlength="8"
                        required
                        placeholder="8 caractères minimum"
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        minlength="8"
                        required
                        placeholder="Répétez votre mot de passe"
                    >
                </div>

                <button type="submit" id="password-button">
                    Activer mon compte
                </button>

               <p
    id="password-message"
    role="status"
    aria-live="polite"
    style="margin-top: 15px; font-weight: 600;"
></p>

            </form>

        </div>
    </main>

</body>
</html>
