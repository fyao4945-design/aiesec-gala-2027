<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Changer le mot de passe | AIESEC Gala 2027</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/change-password.js" defer></script>
</head>

<body class="dashboard-page">

    <aside class="sidebar">

        <a class="brand" href="index.html">
            <img src="assets/logo-aiesec.png" alt="AIESEC">
            <span>GALA <b>2027</b></span>
        </a>

        <p class="sidebar-label">MENU PRINCIPAL</p>

        <a class="side-link" href="dashboard.html">
            ▦ &nbsp; Tableau de bord
        </a>

        <a class="side-link" href="invitations.html">
            ♧ &nbsp; Invitations
        </a>

        <a class="side-link" href="scanner.html">
            ▣ &nbsp; Scanner QR
        </a>

        <a class="side-link active" href="change-password.html">
            🔒 &nbsp; Changer le mot de passe
        </a>

        <div class="sidebar-bottom">

            <a href="index.html" class="side-link">
                ← Voir le site public
            </a>

            <button id="logout-button" class="side-link logout">
                ↪ &nbsp; Déconnexion
            </button>

        </div>

    </aside>

    <main class="dash-content">

        <p class="eyebrow">SÉCURITÉ DU COMPTE</p>

        <h1>Changer le mot de passe</h1>

        <p class="muted">
            Modifiez votre mot de passe pour sécuriser votre espace organisateur.
        </p>

        <section class="content-card" style="max-width: 650px; margin-top: 30px;">

            <div class="card-heading">
                <div>
                    <p class="eyebrow">PARAMÈTRES DU COMPTE</p>
                    <h2>Modification du mot de passe</h2>
                </div>
            </div>

            <form id="password-form">

                <label for="current-password">Ancien mot de passe</label>
                <input
                    type="password"
                    id="current-password"
                    autocomplete="current-password"
                    required
                >

                <label for="new-password">Nouveau mot de passe</label>
                <input
                    type="password"
                    id="new-password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirm-password">Confirmer le nouveau mot de passe</label>
                <input
                    type="password"
                    id="confirm-password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button
                    type="submit"
                    class="button button-full"
                    id="change-password-button"
                    style="margin-top: 20px;"
                >
                    Modifier le mot de passe
                </button>

                <p
                    id="password-message"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>

</body>
</html>
